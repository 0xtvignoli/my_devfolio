# Runs shirudo's own Linux quickstart on a GitHub-hosted runner (KVM + swtpm)
# and keeps the full transcript as evidence for the article.
# ponytail: reuses shirudo's CI scripts instead of re-scripting the quickstart;
# they extract and run the documented command blocks, so docs and proof stay in sync.
name: shirudo quickstart

on:
  workflow_dispatch:
    inputs:
      shirudo_ref:
        description: shirudo commit to test (pin it so the article stays reproducible)
        required: true
        default: 6514073a6b62bb0ae1e2b55a8ab7dabe8c50e414

permissions:
  contents: read

concurrency:
  group: shirudo-quickstart
  cancel-in-progress: true

jobs:
  quickstart:
    runs-on: ubuntu-latest
    # ponytail: no caches (shirudo's live in their repo), so the first run builds the toolchain cold
    timeout-minutes: 120
    steps:
      - name: Check out shirudo
        uses: actions/checkout@v4
        with:
          repository: shirudo-dev/shirudo
          ref: ${{ inputs.shirudo_ref }}
          persist-credentials: false

      - name: Record the environment
        run: |
          mkdir -p evidence
          {
            echo "shirudo commit: $(git rev-parse HEAD)"
            echo "runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
            uname -a
            lscpu | grep -E 'Model name|Virtualization|^CPU\(s\)'
            ls -l /dev/kvm
          } | tee evidence/environment.txt

      # Public prerelease, SHA-256 pinned inside kernel-artifact.sh; no token needed.
      - name: Download the test kernel (bpf-next + shirudo patches)
        run: testing/vm/kernel-artifact.sh download

      - name: Prepare host (KVM access, clang 23, QEMU, swtpm, static deps)
        env:
          KERNEL_CI_ARTIFACT_DIR: ${{ github.workspace }}/build/kernel-ci-artifact
        run: .github/scripts/tests.sh setup

      - name: Run the quickstart and quick guides
        id: guides
        timeout-minutes: 60
        # The cold VM image build runs apt inside libguestfs. Networked through passt (the
        # default as non-root), the appliance with the 26.04 image attached gets no working
        # network on this runner; with qemu user networking it resolves fine (probe run
        # 45582033906, full run 45597020318). prepare-runtime.sh already forces that
        # fallback as root, with a passt that fails --help; do the same as the runner user.
        # shirudo's CI never hits this: it restores the VM image from its cache.
        # ponytail: the readable host kernel is the validated config; untested without it.
        run: |
          sudo chmod 0644 /boot/vmlinuz-*
          mkdir -p "$RUNNER_TEMP/no-passt"
          printf '#!/bin/sh\nexit 127\n' > "$RUNNER_TEMP/no-passt/passt"
          chmod +x "$RUNNER_TEMP/no-passt/passt"
          export PATH="$RUNNER_TEMP/no-passt:$PATH"
          set -o pipefail
          sh .github/scripts/guides-ci.sh run 2>&1 | tee evidence/quickstart-transcript.log

      # The quickstart never shows the headline claim, so show it: the same root, the same
      # two-instruction program, loaded with a raw bpf(BPF_PROG_LOAD) and no signature.
      # ponytail: same ctypes approach as shirudo's testing/end2end/priv_events.py.
      - name: "Demo: unsigned BPF load as root, stock kernel vs shirudo target"
        if: steps.guides.outcome == 'success'
        timeout-minutes: 20
        run: |
          cat > "$RUNNER_TEMP/unsigned-load.py" <<'EOF'
          import ctypes, errno, os, platform, struct
          libc = ctypes.CDLL(None, use_errno=True)
          NR_BPF = {"x86_64": 321, "aarch64": 280}[platform.machine()]
          # r0 = 0; exit  -- the smallest valid program
          insns = ctypes.create_string_buffer(struct.pack("<BBhiBBhi", 0xb7, 0, 0, 0, 0x95, 0, 0, 0))
          lic = ctypes.create_string_buffer(b"GPL")
          attr = ctypes.create_string_buffer(128)
          # prog_type=SOCKET_FILTER(1), insn_cnt=2, insns, license
          struct.pack_into("<IIQQ", attr, 0, 1, 2, ctypes.addressof(insns), ctypes.addressof(lic))
          fd = libc.syscall(NR_BPF, 5, attr, 128)  # 5 = BPF_PROG_LOAD
          err = ctypes.get_errno()
          print(f"kernel {platform.release()}, uid {os.getuid()}")
          print(f"bpf(BPF_PROG_LOAD, unsigned): " + (f"loaded, fd {fd}" if fd >= 0 else f"refused, {errno.errorcode[err]} ({os.strerror(err)})"))
          EOF
          . build/vm-toolchain.env
          export BPF_VMLINUX_BTF="$PWD/artifacts/bpf-next-kernel-debs/vmlinux.btf"
          export PATH="$RUNNER_TEMP/no-passt:$PATH"
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          {
            echo '--- runner host (stock Ubuntu kernel), as root'
            sudo python3 -I "$RUNNER_TEMP/unsigned-load.py"
            make -s -C testing vm VM_NAME=demo </dev/null >/dev/null
            echo '--- shirudo target, as root'
            make -s -C testing vm-ssh VM_NAME=demo VM_SSH_COMMAND='python3 -I -' < "$RUNNER_TEMP/unsigned-load.py"
            make -s -C testing vm-stop VM_NAME=demo
          } 2>&1 | tee evidence/unsigned-load.log

      - name: Summarize the evidence
        if: always()
        run: |
          log=evidence/quickstart-transcript.log
          {
            echo "## shirudo quickstart — outcome: ${{ steps.guides.outcome }}"
            echo '```'
            cat evidence/environment.txt
            echo '```'
            echo "### Key lines (tamper refused, signed load, attestation)"
            echo '```'
            grep -E 'Permission denied|verdict:|attestation key|OK |FAIL' "$log" 2>/dev/null | head -40 || true
            echo '```'
            echo "### Unsigned BPF load as root"
            echo '```'
            cat evidence/unsigned-load.log 2>/dev/null || echo "(not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp build/test-vm/vms/quickstart/console.log evidence/guest-console.log 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shirudo-quickstart-evidence
          path: evidence/
          retention-days: 90
