# Runs shirudo's own Linux quickstart on a GitHub-hosted runner (KVM + swtpm)
# and keeps the full transcript as evidence for the article.
# ponytail: reuses shirudo's CI scripts instead of re-scripting the quickstart;
# they extract and run the documented command blocks, so docs and proof stay in sync.
name: shirudo quickstart

on:
  workflow_dispatch:
    inputs:
      shirudo_ref:
        description: shirudo commit to test (pin it so the article stays reproducible)
        required: true
        default: 6514073a6b62bb0ae1e2b55a8ab7dabe8c50e414
      diagnose:
        description: Only probe the libguestfs appliance network, skip the quickstart
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shirudo-quickstart
  cancel-in-progress: true

jobs:
  quickstart:
    runs-on: ubuntu-latest
    # ponytail: no caches (shirudo's live in their repo), so the first run builds the toolchain cold
    timeout-minutes: 120
    steps:
      - name: Check out shirudo
        uses: actions/checkout@v4
        with:
          repository: shirudo-dev/shirudo
          ref: ${{ inputs.shirudo_ref }}
          persist-credentials: false

      - name: Record the environment
        run: |
          mkdir -p evidence
          {
            echo "shirudo commit: $(git rev-parse HEAD)"
            echo "runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
            uname -a
            lscpu | grep -E 'Model name|Virtualization|^CPU\(s\)'
            ls -l /dev/kvm
          } | tee evidence/environment.txt

      # Public prerelease, SHA-256 pinned inside kernel-artifact.sh; no token needed.
      - name: Download the test kernel (bpf-next + shirudo patches)
        run: testing/vm/kernel-artifact.sh download

      - name: Prepare host (KVM access, clang 23, QEMU, swtpm, static deps)
        env:
          KERNEL_CI_ARTIFACT_DIR: ${{ github.workspace }}/build/kernel-ci-artifact
        run: .github/scripts/tests.sh setup

      # Same appliance + networking virt-customize uses in prepare-runtime.sh, run as the runner user.
      - name: Probe the libguestfs appliance network
        if: inputs.diagnose
        # Same cloud image and virt-customize --network --run-command path as prepare-runtime.sh.
        run: |
          sudo chmod 0644 /boot/vmlinuz-*
          img=ubuntu-26.04-server-cloudimg-amd64.img
          curl -fsSL -o "$RUNNER_TEMP/$img" "https://cloud-images.ubuntu.com/releases/server/26.04/release/$img"
          qemu-img create -q -f qcow2 -F qcow2 -b "$RUNNER_TEMP/$img" "$RUNNER_TEMP/probe.qcow2"
          # Same trick prepare-runtime.sh uses as root: a passt that fails --help makes
          # libguestfs fall back to qemu user networking (slirp).
          mkdir -p "$RUNNER_TEMP/no-passt" && printf '#!/bin/sh\nexit 127\n' > "$RUNNER_TEMP/no-passt/passt" && chmod +x "$RUNNER_TEMP/no-passt/passt"
          export PATH="$RUNNER_TEMP/no-passt:$PATH"
          virt-customize -a "$RUNNER_TEMP/probe.qcow2" --network --no-selinux-relabel --run-command \
            '{ cat /etc/resolv.conf; for ns in 10.0.2.3 168.63.129.16 1.1.1.1 8.8.8.8; do echo "nameserver $ns" > /etc/resolv.conf; echo "== $ns: $(timeout 10 getent hosts archive.ubuntu.com | head -1)"; done; } > /root/probe.txt 2>&1; true'
          virt-cat -a "$RUNNER_TEMP/probe.qcow2" /root/probe.txt

      - name: Run the quickstart and quick guides
        if: ${{ !inputs.diagnose }}
        id: guides
        timeout-minutes: 60
        # Ubuntu keeps /boot/vmlinuz-* root-only. shirudo's build-bundle.sh then boots
        # the libguestfs appliance on a downloaded generic kernel, which comes up without
        # working network, so apt in the cold VM image build cannot resolve anything.
        # On the host kernel the appliance networks fine (diagnose run 45564615714).
        # shirudo's CI never hits this: it restores the VM image from its cache.
        run: |
          sudo chmod 0644 /boot/vmlinuz-*
          set -o pipefail
          sh .github/scripts/guides-ci.sh run 2>&1 | tee evidence/quickstart-transcript.log

      - name: Summarize the evidence
        if: always()
        run: |
          log=evidence/quickstart-transcript.log
          {
            echo "## shirudo quickstart — outcome: ${{ steps.guides.outcome }}"
            echo '```'
            cat evidence/environment.txt
            echo '```'
            echo "### Key lines (tamper refused, signed load, attestation)"
            echo '```'
            grep -E 'Permission denied|verdict:|attestation key|OK |FAIL' "$log" 2>/dev/null | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp build/test-vm/vms/quickstart/console.log evidence/guest-console.log 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shirudo-quickstart-evidence
          path: evidence/
          retention-days: 90
