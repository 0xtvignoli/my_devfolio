# Daily rebuild so /lab shows fresh data: the build runs scripts/observatory.ts
# against Cloudflare (token in Vercel env), this only pokes the deploy hook.
name: observatory

on:
  schedule:
    # 00:30 UTC: the UTC day just closed (the Observatory window ends at that midnight), and the
    # decoy VM's 00:05 aggregate is in its bucket. GitHub may start scheduled runs late; that's fine.
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel production deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$HOOK" || { echo "VERCEL_DEPLOY_HOOK secret missing"; exit 1; }
          curl -fsS -X POST "$HOOK" >/dev/null
