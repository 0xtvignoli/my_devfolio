# Weekly dependency PRs, grouped so the queue stays reviewable. Security
# updates arrive on their own regardless of the schedule.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    target-branch: develop   # main riceve solo merge da develop
    schedule: {interval: weekly}
    groups:
      minor-e-patch: {update-types: [minor, patch]}
    ignore:
      # typescript-eslint supporta TypeScript < 6.1: niente major finché non lo supporta.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # eslint-plugin-react/import/jsx-a11y (via eslint-config-next) dichiarano peer eslint <=9.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # I tipi seguono il runtime Node di Vercel, non l'ultima major.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop   # main riceve solo merge da develop
    schedule: {interval: weekly}
