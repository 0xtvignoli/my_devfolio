<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Kubernetes">
  <defs><linearGradient id="k8s-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1220"/><stop offset="100%" stop-color="#101f38"/></linearGradient></defs>
  <rect width="600" height="400" fill="url(#k8s-bg)"/>
  <text x="40" y="52" fill="#4da3ff" font-family="monospace" font-size="14">~ kubernetes · autoscaling</text>
  <!-- helm/wheel -->
  <g transform="translate(180,210)" stroke="#4da3ff" stroke-width="2.5" fill="none">
    <circle r="60"/><circle r="16"/>
    <g stroke-width="8"><line x1="0" y1="-60" x2="0" y2="-30"/><line x1="0" y1="60" x2="0" y2="30"/><line x1="-60" y1="0" x2="-30" y2="0"/><line x1="60" y1="0" x2="30" y2="0"/><line x1="-42" y1="-42" x2="-21" y2="-21"/><line x1="42" y1="42" x2="21" y2="21"/><line x1="-42" y1="42" x2="-21" y2="21"/><line x1="42" y1="-42" x2="21" y2="-21"/></g>
  </g>
  <!-- scaling pods -->
  <g font-family="monospace" font-size="11">
    <rect x="330" y="150" width="60" height="44" rx="6" fill="#0f1a2e" stroke="#30d158" stroke-width="1.5"/><text x="345" y="177" fill="#30d158">pod</text>
    <rect x="405" y="150" width="60" height="44" rx="6" fill="#0f1a2e" stroke="#30d158" stroke-width="1.5"/><text x="420" y="177" fill="#30d158">pod</text>
    <rect x="480" y="150" width="60" height="44" rx="6" fill="#0f1a2e" stroke="#ff9f0a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="493" y="177" fill="#ff9f0a">+pod</text>
    <rect x="330" y="210" width="60" height="44" rx="6" fill="#0f1a2e" stroke="#30d158" stroke-width="1.5"/><text x="345" y="237" fill="#30d158">pod</text>
    <rect x="405" y="210" width="60" height="44" rx="6" fill="#0f1a2e" stroke="#ff9f0a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="418" y="237" fill="#ff9f0a">+pod</text>
  </g>
  <text x="330" y="300" fill="#4da3ff" font-family="monospace" font-size="12">HPA → 2..8 replicas</text>
  <text x="40" y="372" fill="#6e7d92" font-family="monospace" font-size="12">hpa · keda · cluster-autoscaler · requests/limits</text>
</svg>
