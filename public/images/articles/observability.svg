<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Observability">
  <defs><linearGradient id="obs-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1220"/><stop offset="100%" stop-color="#101f38"/></linearGradient></defs>
  <rect width="600" height="400" fill="url(#obs-bg)"/>
  <text x="40" y="52" fill="#4da3ff" font-family="monospace" font-size="14">~ observability · slo</text>
  <!-- chart frame -->
  <rect x="60" y="90" width="480" height="220" rx="8" fill="#0f1a2e" stroke="#3a4a63" stroke-width="1.5"/>
  <line x1="60" y1="160" x2="540" y2="160" stroke="#243247" stroke-width="1"/>
  <line x1="60" y1="230" x2="540" y2="230" stroke="#243247" stroke-width="1"/>
  <!-- SLO threshold -->
  <line x1="60" y1="140" x2="540" y2="140" stroke="#ff9f0a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="470" y="134" fill="#ff9f0a" font-family="monospace" font-size="11">SLO 99.9%</text>
  <!-- latency line -->
  <polyline points="70,240 130,215 190,225 250,195 310,210 370,175 430,200 500,165" fill="none" stroke="#4da3ff" stroke-width="2.5"/>
  <!-- request rate (green) -->
  <polyline points="70,285 130,270 190,278 250,255 310,268 370,250 430,262 500,245" fill="none" stroke="#30d158" stroke-width="2"/>
  <text x="40" y="372" fill="#6e7d92" font-family="monospace" font-size="12">prometheus · grafana · error budgets · p95/p99</text>
</svg>
