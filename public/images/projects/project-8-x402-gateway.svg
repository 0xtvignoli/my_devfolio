<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Agent-Native Inference Gateway">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0a0e1a"/><stop offset="100%" stop-color="#0a1f24"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg8)"/>
  <text x="40" y="48" fill="#7dd3fc" font-family="monospace" font-size="13">agent-native inference · x402</text>
  <g font-family="monospace">
    <rect x="45" y="150" width="110" height="94" rx="10" fill="#0f1419" stroke="#00d9ff" stroke-width="1.5"/>
    <text x="66" y="182" fill="#e0f2fe" font-size="12">AI agent</text>
    <text x="66" y="204" fill="#facc15" font-size="10">wallet · USDC</text>
    <text x="66" y="224" fill="#64748b" font-size="10">no API key</text>
    <rect x="240" y="150" width="150" height="94" rx="10" fill="#0f1419" stroke="#a855f7" stroke-width="1.5"/>
    <text x="262" y="182" fill="#e0f2fe" font-size="12">Cloudflare edge</text>
    <text x="262" y="204" fill="#c4b5fd" font-size="10">x402 rules engine</text>
    <text x="262" y="224" fill="#64748b" font-size="10">meter · settle</text>
    <rect x="455" y="165" width="110" height="64" rx="10" fill="#0f1419" stroke="#22c55e" stroke-width="1.5"/>
    <text x="477" y="192" fill="#e0f2fe" font-size="12">LLM gateway</text><text x="477" y="212" fill="#64748b" font-size="10">vLLM · cache</text>
  </g>
  <!-- 402 handshake between agent and edge -->
  <text x="197" y="126" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">402 → pay → 200</text>
  <line x1="155" y1="188" x2="240" y2="188" stroke="#00d9ff" stroke-width="2"/>
  <line x1="240" y1="206" x2="155" y2="206" stroke="#facc15" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- forward to origin -->
  <line x1="390" y1="197" x2="455" y2="197" stroke="#a855f7" stroke-width="2"/>
  <!-- settlement to wallet -->
  <path d="M315 244 C315 300 197 300 197 244" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="300" y="322" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="12">peer-to-peer settlement → your wallet</text>
  <text x="40" y="372" fill="#64748b" font-family="monospace" font-size="11">HTTP 402 · stablecoin micropayments · pay-per-request · cache-hit discount</text>
</svg>
