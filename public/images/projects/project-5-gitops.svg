<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="GitOps Delivery Platform">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0a0e1a"/><stop offset="100%" stop-color="#0a1628"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg5)"/>
  <text x="40" y="48" fill="#7dd3fc" font-family="monospace" font-size="13">gitops · argo cd · progressive delivery</text>
  <!-- flow: git -> argo -> cluster -->
  <g font-family="monospace">
    <rect x="60" y="160" width="120" height="70" rx="10" fill="#0f1419" stroke="#00d9ff" stroke-width="1.5"/>
    <text x="82" y="192" fill="#e0f2fe" font-size="12">Git repo</text><text x="82" y="212" fill="#64748b" font-size="10">desired state</text>
    <rect x="240" y="160" width="120" height="70" rx="10" fill="#0f1419" stroke="#a855f7" stroke-width="1.5"/>
    <text x="262" y="192" fill="#e0f2fe" font-size="12">Argo CD</text><text x="262" y="212" fill="#64748b" font-size="10">reconcile</text>
    <rect x="420" y="160" width="120" height="70" rx="10" fill="#0f1419" stroke="#22c55e" stroke-width="1.5"/>
    <text x="442" y="192" fill="#e0f2fe" font-size="12">Cluster</text><text x="442" y="212" fill="#64748b" font-size="10">live state</text>
  </g>
  <line x1="180" y1="195" x2="240" y2="195" stroke="#00d9ff" stroke-width="2"/>
  <line x1="360" y1="195" x2="420" y2="195" stroke="#a855f7" stroke-width="2"/>
  <!-- reconcile arrow back -->
  <path d="M480 250 C480 300 300 300 300 250" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="300,250 292,266 312,262" fill="#22c55e"/>
  <text x="300" y="322" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="12">self-heal · synced ✓</text>
  <text x="40" y="372" fill="#64748b" font-family="monospace" font-size="11">ApplicationSets · Argo Rollouts · 30+ services · onboarding −70%</text>
</svg>
