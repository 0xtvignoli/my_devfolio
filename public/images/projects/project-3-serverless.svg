<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Serverless CI/CD Pipeline">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="50%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg3)"/>
  <text x="40" y="48" fill="#7dd3fc" font-family="monospace" font-size="13">serverless ci/cd · aws</text>
  <!-- Pipeline stages -->
  <line x1="80" y1="200" x2="520" y2="200" stroke="url(#pipe)" stroke-width="3" opacity="0.6"/>
  <g>
    <rect x="70" y="160" width="90" height="80" rx="10" fill="#0f1419" stroke="#00d9ff" stroke-width="1.5"/>
    <text x="88" y="195" fill="#e0f2fe" font-family="monospace" font-size="10">Source</text>
    <text x="88" y="215" fill="#64748b" font-family="monospace" font-size="9">GitHub</text>
    <rect x="190" y="160" width="90" height="80" rx="10" fill="#0f1419" stroke="#a855f7" stroke-width="1.5"/>
    <text x="205" y="195" fill="#e0f2fe" font-family="monospace" font-size="10">Build</text>
    <text x="205" y="215" fill="#64748b" font-family="monospace" font-size="9">CodeBuild</text>
    <rect x="310" y="160" width="90" height="80" rx="10" fill="#0f1419" stroke="#ff9900" stroke-width="1.5"/>
    <text x="320" y="195" fill="#e0f2fe" font-family="monospace" font-size="10">Deploy</text>
    <text x="320" y="215" fill="#64748b" font-family="monospace" font-size="9">Lambda</text>
    <rect x="430" y="160" width="90" height="80" rx="10" fill="#0f1419" stroke="#22c55e" stroke-width="1.5"/>
    <text x="448" y="195" fill="#e0f2fe" font-family="monospace" font-size="10">Live</text>
    <text x="448" y="215" fill="#64748b" font-family="monospace" font-size="9">Prod</text>
  </g>
  <!-- Lambda icon -->
  <polygon points="300,290 340,320 300,350 260,320" fill="none" stroke="#ff9900" stroke-width="2"/>
  <text x="285" y="326" fill="#ff9900" font-family="monospace" font-size="10">λ</text>
  <text x="40" y="370" fill="#64748b" font-family="monospace" font-size="11">CodePipeline · Lambda · −55% cost</text>
</svg>
