<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Multi-Cloud Kubernetes Platform">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f2847"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg1)"/>
  <g opacity="0.15" stroke="#00d9ff" stroke-width="0.5">
    <line x1="0" y1="50" x2="600" y2="50"/><line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/><line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="50" y1="0" x2="50" y2="400"/><line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/><line x1="350" y1="0" x2="350" y2="400"/>
  </g>
  <text x="40" y="48" fill="#7dd3fc" font-family="monospace" font-size="13">multi-cloud / kubernetes</text>
  <!-- AWS cloud -->
  <ellipse cx="160" cy="130" rx="70" ry="36" fill="none" stroke="#ff9900" stroke-width="2" opacity="0.8"/>
  <text x="130" y="135" fill="#ff9900" font-family="system-ui" font-size="14" font-weight="600">AWS</text>
  <!-- GCP cloud -->
  <ellipse cx="440" cy="130" rx="70" ry="36" fill="none" stroke="#4285f4" stroke-width="2" opacity="0.8"/>
  <text x="410" y="135" fill="#4285f4" font-family="system-ui" font-size="14" font-weight="600">GCP</text>
  <!-- K8s hexagon cluster -->
  <polygon points="300,175 340,198 340,244 300,267 260,244 260,198" fill="none" stroke="url(#accent1)" stroke-width="2.5"/>
  <text x="278" y="228" fill="#00d9ff" font-family="monospace" font-size="11">K8s</text>
  <!-- Worker nodes -->
  <rect x="120" y="280" width="100" height="56" rx="8" fill="#0f1419" stroke="#00d9ff" stroke-width="1.5" opacity="0.9"/>
  <text x="135" y="305" fill="#e0f2fe" font-family="monospace" font-size="10">node-1</text>
  <circle cx="200" cy="310" r="5" fill="#22c55e"/>
  <rect x="250" y="280" width="100" height="56" rx="8" fill="#0f1419" stroke="#00d9ff" stroke-width="1.5" opacity="0.9"/>
  <text x="265" y="305" fill="#e0f2fe" font-family="monospace" font-size="10">node-2</text>
  <circle cx="330" cy="310" r="5" fill="#22c55e"/>
  <rect x="380" y="280" width="100" height="56" rx="8" fill="#0f1419" stroke="#00d9ff" stroke-width="1.5" opacity="0.9"/>
  <text x="395" y="305" fill="#e0f2fe" font-family="monospace" font-size="10">node-3</text>
  <circle cx="460" cy="310" r="5" fill="#22c55e"/>
  <!-- Connection lines -->
  <line x1="160" y1="166" x2="260" y2="210" stroke="#00d9ff" stroke-width="1" opacity="0.5" stroke-dasharray="4"/>
  <line x1="440" y1="166" x2="340" y2="210" stroke="#4285f4" stroke-width="1" opacity="0.5" stroke-dasharray="4"/>
  <line x1="300" y1="267" x2="300" y2="280" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
  <text x="40" y="370" fill="#64748b" font-family="monospace" font-size="11">Terraform · Helm · Prometheus</text>
</svg>
