<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Observability Stack">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f2027"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg4)"/>
  <text x="40" y="48" fill="#7dd3fc" font-family="monospace" font-size="13">observability · prometheus · grafana</text>
  <!-- Dashboard panel -->
  <rect x="50" y="70" width="500" height="260" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="70" y="98" fill="#64748b" font-family="monospace" font-size="11">cluster overview — grafana</text>
  <!-- Metric charts (simplified) -->
  <polyline points="70,280 120,240 170,250 220,200 270,210 320,170 370,180 420,140 470,150 520,120" fill="none" stroke="#00d9ff" stroke-width="2"/>
  <polyline points="70,300 120,290 170,285 220,270 270,265 320,250 370,255 420,230 470,235 520,220" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.7"/>
  <!-- Legend chips -->
  <rect x="70" y="115" width="80" height="24" rx="12" fill="#0f1419" stroke="#00d9ff" stroke-width="1"/>
  <text x="82" y="131" fill="#00d9ff" font-family="monospace" font-size="10">CPU 12%</text>
  <rect x="165" y="115" width="80" height="24" rx="12" fill="#0f1419" stroke="#22c55e" stroke-width="1"/>
  <text x="177" y="131" fill="#22c55e" font-family="monospace" font-size="10">UP 99.9%</text>
  <rect x="260" y="115" width="90" height="24" rx="12" fill="#0f1419" stroke="#f59e0b" stroke-width="1"/>
  <text x="272" y="131" fill="#f59e0b" font-family="monospace" font-size="10">p95 81ms</text>
  <!-- Stack logos text -->
  <text x="70" y="355" fill="#e6522c" font-family="system-ui" font-size="12" font-weight="600">Prometheus</text>
  <text x="180" y="355" fill="#f46800" font-family="system-ui" font-size="12" font-weight="600">Grafana</text>
  <text x="270" y="355" fill="#ffd700" font-family="system-ui" font-size="12" font-weight="600">Loki</text>
  <text x="330" y="355" fill="#007bff" font-family="system-ui" font-size="12" font-weight="600">Tempo</text>
</svg>
